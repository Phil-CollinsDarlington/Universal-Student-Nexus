# =================================================================
# NETLIFY CONFIGURATION — Universal Student Nexus
# This is a plain static site: no build command is required.
# Netlify will detect the forms in pages/join.html, pages/contact.html
# and pages/partners.html automatically because they carry the
# data-netlify="true" attribute.
# =================================================================

[build]
  publish = "."

# Custom 404 page (Netlify serves 404.html automatically when it
# lives at the site root, but this makes the behaviour explicit).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
